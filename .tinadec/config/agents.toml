graph = "{\"edges\":[{\"source\":\"template\",\"target\":\"assemble\"}],\"nodes\":[{\"config\":{\"content\":\"本模式是声明边图协作：任务沿模式声明的边流动，每条边带一份数据契约。\\n主人该怎么做：把任务沿声明边派发给目标节点——assignee 只能是声明边的目标，按职责选——派发时按该边的契约声明请求字段；不要绕过边自行搭建执行层，也不要把一个任务同时扔给多个目标当作提高成功率的手段。\\n子智能体：你是声明图上的一个执行者，只接受按边契约派给你的任务，返回契约要求的全部响应字段——缺字段等同于任务未完成，而不是「大致做完」。\\n共同底线：先取证再动手；写操作逐次需要人工批准；路径参数一律传工作区内的绝对路径。\"},\"id\":\"template\",\"type\":\"template\"},{\"id\":\"assemble\",\"type\":\"assemble\"}]}"
