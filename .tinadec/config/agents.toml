i18n = "{\"en\":{\"description\":\"The fallback baseline used when no mode-level pipeline overrides it.\",\"display_name\":\"Graph Seed Baseline Pipeline\",\"templates\":{\"template\":\"DmaEA graph orchestration baseline: collaborate along the declared topology; permissions only narrow, never widen.\"}},\"ja\":{\"description\":\"モード固有のパイプラインに覆われていない場合のフォールバックベースラインです。\",\"display_name\":\"Graph seed ベースラインパイプライン\",\"templates\":{\"template\":\"DmaEA グラフ編成のベースライン：宣言されたトポロジーに従って協働し、権限は狭めることのみ可能で広げることはできない。\"}},\"ru\":{\"description\":\"Резервная базовая линия, когда конвейер уровня режима не покрывает случай.\",\"display_name\":\"Базовый конвейер Graph seed\",\"templates\":{\"template\":\"Базовая линия графовой оркестрации DmaEA: взаимодействие по объявленной топологии, права только сужаются, но не расширяются.\"}},\"zh-CN\":{\"description\":\"未被模式级管线覆盖时的兜底基线。\",\"display_name\":\"Graph seed 基线管线\",\"templates\":{\"template\":\"DmaEA 图编排基线：按声明拓扑协作，权限只收窄不放宽。\"}},\"zh-TW\":{\"description\":\"未被模式層級管線覆蓋時的後備基線。\",\"display_name\":\"Graph 種子基線管線\",\"templates\":{\"template\":\"DmaEA 圖編排基線：依宣告的拓撲協作，權限只收窄不放寬。\"}}}"
