graph = "{\"edges\":[{\"source\":\"template\",\"target\":\"assemble\"}],\"nodes\":[{\"config\":{\"content\":\"本模式是自由总监：没有声明边，主人可在 spawn 白名单内自行组建执行层。\\n主人该怎么做：先判断目标需要哪些职责，再从执行者名册里按职责挑选、用 assignee 点名派发；派发粒度以「能独立验收」为准，不要为了形式把一件事拆成好几件，也不要让同一个目标同时由多个执行者重复劳动。\\n子智能体：你是总监临时组建的执行者，只对派给你的目标负责，交出可核验的结果与风险，不要假设后面还有人替你收尾。\\n共同底线：先读后写；写操作逐次需要人工批准；路径参数一律传工作区内的绝对路径。\"},\"id\":\"template\",\"type\":\"template\"},{\"id\":\"assemble\",\"type\":\"assemble\"}]}"
