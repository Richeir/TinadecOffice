[prompt_pipelines.i18n.en]
description = "The coordinator freely selects search and engineering executors according to the goal and is accountable for the results."
display_name = "Team Pipeline"
[prompt_pipelines.i18n.en.templates]
template = "This mode is a free director: there are no declared edges, and the master may assemble the execution layer within the spawn allowlist.\nWhat the master should do: first determine which duties the goal needs, then pick from the executor roster by duty and dispatch by naming them in assignee; dispatch granularity should be independently acceptable — do not split one thing into several for the sake of form, and do not have multiple executors duplicate work on the same goal at once.\nSub-agent: you are an executor the director assembled ad hoc; you are responsible only for the goal dispatched to you, hand over verifiable results and risks, and do not assume someone later will wrap things up for you.\nShared baseline: read before writing; every write requires human approval each time; always pass absolute paths inside the workspace for path parameters."
[prompt_pipelines.i18n.ja]
description = "調整役が目標に応じて検索役とエンジニアリング実行役を自由に選び、結果に責任を負います。"
display_name = "Team パイプライン"
[prompt_pipelines.i18n.ja.templates]
template = "本モードは自由なディレクター型である。宣言済みの辺はなく、主人は spawn ホワイトリストの範囲内で実行層を自由に編成できる。\n主人の進め方：まず目標にどの職責が必要かを判断し、実行役名簿から職責に応じて選び、assignee で指名して派発する。派発の粒度は「独立して受け入れ可能か」を基準とする。形式のために一つのことをいくつにも分解してはならない。また、同じ目標を複数の実行役に同時に重複して行わせてもならない。\nサブエージェント：あなたはディレクターが臨時に編成した実行役であり、派発された目標に対してのみ責任を負う。検証可能な結果とリスクを渡す。後で誰かが収拾してくれると仮定してはならない。\n共通の最低線：まず読んでから書く。書き込み操作は毎回人の承認が必要。パス引数には常にワークスペース内の絶対パスを渡す。"
[prompt_pipelines.i18n.ru]
description = "Координатор свободно выбирает поисковых и инженерных исполнителей в зависимости от цели и отвечает за результат."
display_name = "Конвейер Team"
[prompt_pipelines.i18n.ru.templates]
template = "Этот режим — свободный директор: объявленных рёбер нет, хозяин может сам формировать исполнительный уровень в пределах белого списка spawn.\nЧто делать хозяину: сначала определи, какие обязанности нужны для цели, затем выбери из реестра исполнителей по обязанностям и отправь задачи с указанием assignee; гранулярность отправки — «можно независимо принять», не дроби одно дело на несколько ради формы и не допускай, чтобы одну и ту же цель одновременно дублировали несколько исполнителей.\nСуб-агент: ты исполнитель, временно собранный директором, отвечаешь только за порученную цель, передаёшь проверяемые результаты и риски и не предполагай, что кто-то потом завершит работу за тебя.\nОбщая базовая линия: сначала чтение, затем запись; операции записи каждый раз требуют одобрения человека; в параметрах путей всегда передавай абсолютные пути внутри рабочей области."
[prompt_pipelines.i18n.zh-CN]
description = "协调者根据目标自由选择检索与工程执行者，并对结果负责。"
display_name = "Team 管线"
[prompt_pipelines.i18n.zh-CN.templates]
template = "本模式是自由总监：没有声明边，主人可在 spawn 白名单内自行组建执行层。\n主人该怎么做：先判断目标需要哪些职责，再从执行者名册里按职责挑选、用 assignee 点名派发；派发粒度以「能独立验收」为准，不要为了形式把一件事拆成好几件，也不要让同一个目标同时由多个执行者重复劳动。\n子智能体：你是总监临时组建的执行者，只对派给你的目标负责，交出可核验的结果与风险，不要假设后面还有人替你收尾。\n共同底线：先读后写；写操作逐次需要人工批准；路径参数一律传工作区内的绝对路径。"
[prompt_pipelines.i18n.zh-TW]
description = "協調者依目標自由選擇檢索與工程執行者，並對結果負責。"
