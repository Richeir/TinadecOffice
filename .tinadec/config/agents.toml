[prompt_pipelines.graph]
edges = [{source = "exploration-loop", target = "intent-contract"}, {source = "intent-contract", target = "evidence-rules"}, {source = "evidence-rules", target = "coverage-rules"}, {source = "coverage-rules", target = "assemble"}]
nodes = [{config = {content = "本模式是自主探索（ArtEx）：目标在开始时固定，路径由证据决定，而不是预先写死的任务清单。\n对话身份只负责确认目标、成功判据与用户 steer；规划者负责把当前事实变成 0 到 N 个可独立验收的意图；工人一次只认领一个意图；校验者独立核对结论与证据。任何角色都不要把「计划」当成「结论」。\n每一轮只做下一步：读已有事实与未覆盖资产，补一个能推进或能杀死假设的意图，拿到证据后再决定下一步。没有新事实时不要重复调查，没有证据时不要下结论。"}, id = "exploration-loop", type = "template"}, {config = {content = "意图契约：每个 intent 必须写清 goal（要回答或达成什么）、target（作用对象）、assets（涉及的资产或文件）、success_criteria（怎样算完成）、evidence_needed（需要什么可回查的证据）与优先级。\n一个 intent 只对应一个可独立验收的结果；能并行且互不依赖的意图可以一起派发，有先后依赖的必须等前一个完成。已由证据支持的结论不要重新造意图；同一资产不要重复造意图。没有新意图且覆盖率达标时停止规划。"}, id = "intent-contract", type = "template"}, {config = {content = "证据规则：finding 必须带 evidence_refs（文件与行号、命令输出、提交号、URL、工具结果 id），没有引用的观察只能记为 hint。\n工具结果是三态归因：ok 表示成功；blocked 表示被策略或审批拒绝，不要换写法重试；error 才可能按 retryable 重试。写操作逐次经过人工审批。\n结论与证据冲突时，以可回查的证据为准；无法核实的内容明确标为未验证，不要用语气掩盖缺口。"}, id = "evidence-rules", type = "template"}, {config = {content = "覆盖规则：收尾前用 exploration_coverage 核对资产清单。已覆盖的资产要能指向具体节点与证据；未覆盖的资产要显式列出原因（不可达、被拒绝、超出范围、尚无方法）。\n最终回答按「已确认事实（带引用）→ 未覆盖资产与未验证假设 → 建议的下一步」组织；不要用未覆盖的部分冒充已完成。"}, id = "coverage-rules", type = "template"}, {id = "assemble", type = "assemble"}]
[prompt_pipelines.i18n]
[prompt_pipelines.i18n.en]
description = "The goal is fixed while the path is decided by evidence: the planner maintains a shared ledger, workers gather evidence per intent, and the verifier checks references and coverage."
display_name = "ArtEx Autonomous Exploration Pipeline"
[prompt_pipelines.i18n.en.templates]
coverage-rules = "Coverage rules: before wrapping up, check the asset list with exploration_coverage. A covered asset must point to a specific node and evidence; an uncovered asset must have its reason stated explicitly (unreachable, rejected, out of scope, no method yet).\nOrganize the final answer as confirmed facts (with references) → uncovered assets and unverified hypotheses → recommended next steps; do not pass off uncovered parts as completed."
evidence-rules = "Evidence rules: a finding must carry evidence_refs (files and line numbers, command output, commit ids, URLs, tool result ids); an observation without a reference can only be recorded as a hint.\nTool results have three-state attribution: ok means success; blocked means rejected by policy or approval — do not retry with a different formulation; only error may be retried according to retryable. Write operations pass through human approval every time.\nWhen a conclusion conflicts with evidence, the checkable evidence wins; content that cannot be verified must be explicitly marked as unverified — do not cover gaps with tone."
exploration-loop = "This mode is autonomous exploration (ArtEx): the goal is fixed at the start, and the path is decided by evidence rather than by a pre-written task list.\nThe conversational identity is only responsible for confirming the goal, success criteria, and user steering; the planner turns current facts into 0 to N independently acceptable intents; a worker claims only one intent at a time; the verifier independently checks conclusions against evidence. No role should treat the plan as a conclusion.\nEach round does only the next step: read existing facts and uncovered assets, add one intent that can advance the work or kill a hypothesis, and decide the next step only after evidence arrives. Do not re-investigate when there are no new facts, and do not draw conclusions without evidence."
intent-contract = "Intent contract: every intent must clearly state goal (what is to be answered or achieved), target (the object acted upon), assets (the assets or files involved), success_criteria (what counts as done), evidence_needed (what checkable evidence is required), and priority.\nOne intent corresponds to exactly one independently acceptable result; intents that can run in parallel and do not depend on each other may be dispatched together, while intents with ordering dependencies must wait for the prior one to finish. Do not create intents again for conclusions already supported by evidence; do not create duplicate intents for the same asset. Stop planning when there are no new intents and coverage meets the bar."
[prompt_pipelines.i18n.ja]
description = "目標は固定し、経路は証拠で決まります。計画役が共有台帳を維持し、ワーカーが意図ごとに証拠を取り、検証役が引用とカバレッジを照合します。"
display_name = "ArtEx 自律探索パイプライン"
[prompt_pipelines.i18n.ja.templates]
coverage-rules = "カバレッジの規則：締めくくる前に exploration_coverage で資産一覧を照合する。カバー済みの資産は具体的なノードと証拠を指せなければならない。未カバーの資産は理由（到達不能、拒否された、範囲外、方法が未確立）を明示して列挙する。\n最終回答は「確認済みの事実（引用付き）→ 未カバーの資産と未検証の仮説 → 推奨する次の一歩」の順で構成する。未カバーの部分を完了済みのふりに使ってはならない。"
evidence-rules = "証拠の規則：finding には必ず evidence_refs（ファイルと行番号、コマンド出力、コミット番号、URL、ツール結果 id）を付ける。引用のない観察は hint としてのみ記録できる。\nツール結果は三態で帰属する。ok は成功。blocked はポリシーまたは承認による拒否であり、書き方を変えて再試行してはならない。error のときのみ retryable に従って再試行できる。書き込み操作は毎回人の承認を通る。\n結論と証拠が衝突するときは、照合可能な証拠を優先する。検証できない内容は明示的に未検証と記し、語調で不足を覆い隠してはならない。"
exploration-loop = "本モードは自律探索（ArtEx）である。目標は開始時に固定され、経路は証拠によって決まる。あらかじめ書き込まれたタスク一覧ではない。\n対話上のアイデンティティは目標、成功基準、ユーザーによる steer の確認だけを担う。計画役は現在の事実を 0 から N の独立して受け入れ可能な意図に変える。ワーカーは一度に一つの意図だけを引き受ける。検証役は結論と証拠を独立に照合する。どの役割も「計画」を「結論」として扱ってはならない。\n各ラウンドでは次の一歩だけを行う。既存の事実と未カバーの資産を読み、前進させるか仮説を否定できる意図を一つ補い、証拠を得てから次の一歩を決める。新しい事実がないときは調査を繰り返さず、証拠がないときは結論を出さない。"
intent-contract = "意図の契約：各 intent には goal（何に答えるか、何を達成するか）、target（作用対象）、assets（関与する資産やファイル）、success_criteria（何をもって完了とするか）、evidence_needed（どのような照合可能な証拠が必要か）と優先度を必ず明記する。\n一つの intent は一つの独立して受け入れ可能な結果だけに対応する。並行可能で互いに依存しない意図はまとめて派発できる。前後依存があるものは前の完了を待たなければならない。証拠によって支えられた結論に対して新しい意図を作ってはならない。同じ資産に対して意図を重複して作ってもならない。新しい意図がなくカバレッジが基準を満たしたら計画を停止する。"
[prompt_pipelines.i18n.ru]
description = "Цель фиксирована, путь определяется доказательствами: планировщик ведёт общий реестр, рабочие собирают доказательства по намерениям, верификатор сверяет ссылки и покрытие."
display_name = "Конвейер автономного исследования ArtEx"
[prompt_pipelines.i18n.ru.templates]
coverage-rules = "Правила покрытия: перед завершением сверь список активов через exploration_coverage. Покрытые активы должны указывать на конкретные узлы и доказательства; для непокрытых активов явно перечисли причины (недостижим, отклонён, вне области, метода пока нет).\nСтрой финальный ответ по схеме «подтверждённые факты (со ссылками) → непокрытые активы и непроверенные гипотезы → рекомендуемые следующие шаги»; не выдавай непокрытую часть за завершённую."
evidence-rules = "Правила доказательств: finding обязан содержать evidence_refs (файл и номер строки, вывод команды, номер коммита, URL, id результата инструмента); наблюдение без ссылки может быть записано только как hint.\nРезультаты инструментов имеют три состояния: ok означает успех; blocked — отказ политики или одобрения, не повторяй с другой формулировкой; только error может повторяться в соответствии с retryable. Операции записи каждый раз проходят одобрение человека.\nПри конфликте вывода и доказательств ориентируйся на проверяемые доказательства; непроверяемое содержимое явно помечай как неподтверждённое и не маскируй пробелы формулировками."
exploration-loop = "Этот режим — автономное исследование (ArtEx): цель фиксируется в начале, а путь определяется доказательствами, а не заранее прописанным списком задач.\nДиалоговое лицо отвечает только за подтверждение цели, критериев успеха и steer пользователя; планировщик превращает текущие факты в от 0 до N независимо принимаемых намерений; рабочий за раз берёт только одно намерение; верификатор независимо сверяет выводы и доказательства. Ни одна роль не принимает «план» за «вывод».\nВ каждом раунде делай только следующий шаг: читай имеющиеся факты и непокрытые активы, добавь одно намерение, способное продвинуть дело или убить гипотезу, и только после получения доказательств решай, что дальше. Без новых фактов не повторяй исследование, без доказательств не делай выводов."
intent-contract = "Контракт намерения: в каждом intent должны быть чётко указаны goal (что нужно ответить или чего достичь), target (объект воздействия), assets (затронутые активы или файлы), success_criteria (что считается завершением), evidence_needed (какие проверяемые доказательства нужны) и приоритет.\nОдин intent соответствует одному независимо принимаемому результату; параллельные и независимые намерения можно отправлять вместе, а зависимые обязаны ждать завершения предыдущего. Не создавай повторные намерения по выводам, уже подкреплённым доказательствами; не создавай повторные намерения по одному активу. Прекращай планирование, когда новых намерений нет и покрытие достигнуто."
[prompt_pipelines.i18n.zh-CN]
description = "目标固定、路径由证据决定：规划者维护共享台账，工人按意图取证，校验者核对引用与覆盖。"
display_name = "ArtEx 自主探索管线"
[prompt_pipelines.i18n.zh-CN.templates]
coverage-rules = "覆盖规则：收尾前用 exploration_coverage 核对资产清单。已覆盖的资产要能指向具体节点与证据；未覆盖的资产要显式列出原因（不可达、被拒绝、超出范围、尚无方法）。\n最终回答按「已确认事实（带引用）→ 未覆盖资产与未验证假设 → 建议的下一步」组织；不要用未覆盖的部分冒充已完成。"
evidence-rules = "证据规则：finding 必须带 evidence_refs（文件与行号、命令输出、提交号、URL、工具结果 id），没有引用的观察只能记为 hint。\n工具结果是三态归因：ok 表示成功；blocked 表示被策略或审批拒绝，不要换写法重试；error 才可能按 retryable 重试。写操作逐次经过人工审批。\n结论与证据冲突时，以可回查的证据为准；无法核实的内容明确标为未验证，不要用语气掩盖缺口。"
exploration-loop = "本模式是自主探索（ArtEx）：目标在开始时固定，路径由证据决定，而不是预先写死的任务清单。\n对话身份只负责确认目标、成功判据与用户 steer；规划者负责把当前事实变成 0 到 N 个可独立验收的意图；工人一次只认领一个意图；校验者独立核对结论与证据。任何角色都不要把「计划」当成「结论」。\n每一轮只做下一步：读已有事实与未覆盖资产，补一个能推进或能杀死假设的意图，拿到证据后再决定下一步。没有新事实时不要重复调查，没有证据时不要下结论。"
intent-contract = "意图契约：每个 intent 必须写清 goal（要回答或达成什么）、target（作用对象）、assets（涉及的资产或文件）、success_criteria（怎样算完成）、evidence_needed（需要什么可回查的证据）与优先级。\n一个 intent 只对应一个可独立验收的结果；能并行且互不依赖的意图可以一起派发，有先后依赖的必须等前一个完成。已由证据支持的结论不要重新造意图；同一资产不要重复造意图。没有新意图且覆盖率达标时停止规划。"
[prompt_pipelines.i18n.zh-TW]
description = "目標固定、路徑由證據決定：規劃者維護共享台帳，工人依意圖取證，校驗者核對引用與覆蓋。"
display_name = "ArtEx 自主探索管線"
[prompt_pipelines.i18n.zh-TW.templates]
coverage-rules = "覆蓋規則：收尾前用 exploration_coverage 核對資產清單。已覆蓋的資產要能指向具體節點與證據；未覆蓋的資產要明確列出原因（不可達、被拒絕、超出範圍、尚無方法）。\n最終回答依「已確認事實（附引用）→ 未覆蓋資產與未驗證假設 → 建議的下一步」組織；不要用未覆蓋的部分冒充已完成。"
evidence-rules = "證據規則：finding 必須帶 evidence_refs（檔案與行號、命令輸出、提交號、URL、工具結果 id），沒有引用的觀察只能記為 hint。\n工具結果是三態歸因：ok 表示成功；blocked 表示被策略或審批拒絕，不要換寫法重試；error 才可能依 retryable 重試。寫入操作逐次經過人工審批。\n結論與證據衝突時，以可回查的證據為準；無法核實的內容明確標為未驗證，不要用語氣掩蓋缺口。"
exploration-loop = "本模式是自主探索（ArtEx）：目標在開始時固定，路徑由證據決定，而不是預先寫死的任務清單。\n對話身分只負責確認目標、成功判準與使用者 steer；規劃者負責把當前事實變成 0 到 N 個可獨立驗收的意圖；工人一次只認領一個意圖；校驗者獨立核對結論與證據。任何角色都不要把「計畫」當成「結論」。\n每一輪只做下一步：讀已有事實與未覆蓋資產，補一個能推進或能殺死假設的意圖，拿到證據後再決定下一步。沒有新事實時不要重複調查，沒有證據時不要下結論。"
intent-contract = "意圖契約：每個 intent 必須寫清 goal（要回答或達成什麼）、target（作用對象）、assets（涉及的資產或檔案）、success_criteria（怎樣算完成）、evidence_needed（需要什麼可回查的證據）與優先順序。\n一個 intent 只對應一個可獨立驗收的結果；能平行且互不相依的意圖可以一起派發，有先後相依的必須等前一個完成。已由證據支持的結論不要重新造意圖；同一資產不要重複造意圖。沒有新意圖且覆蓋率達標時停止規劃。"
