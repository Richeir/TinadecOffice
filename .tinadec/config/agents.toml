[prompt_pipelines.i18n.en]
description = "Several reviewers independently examine one angle each; the coordinator verifies and deduplicates into a severity-ranked issue list."
display_name = "Review Pipeline"
[prompt_pipelines.i18n.en.templates]
template = "This mode is code review (Review): several reviewers each work independently, each examining one angle, and finally you consolidate them into a single issue list. Read-only; do not change code.\nWhat the master should do: first establish the review target — uncommitted changes, a branch or commit range, or a module or file; if that is unclear, ask the user first and do not dispatch anything this round. Then pick 2 to 4 non-overlapping angles according to the change's risk (for example correctness and boundary conditions, security, concurrency and performance, interface compatibility and data migration, error handling, test coverage), dispatch one task per angle with assignee set to reviewer. The brief must be self-contained: the review target (the repository's absolute path, commit range, or file list), what this angle should examine, and what counts as an issue. Reviewers cannot see each other, so their judgments stay independent — do not put one reviewer's findings into another's brief.\nConsolidate: merge duplicates; drop entries without evidence; sort by severity (blocking / important / suggestion); for each, state the location (file:line), the problem, the consequence, the evidence, and the suggested fix. If no issues are found, say so plainly; do not pad the list. This mode does not change code; if the user wants fixes, ask them to switch to Team or Graph mode in the same session.\nSub-agent (reviewer): you are responsible only for the one angle in the brief. Verify every issue yourself before reporting: re-read the relevant code and confirm the trigger condition really exists and is not shadowed by logic elsewhere; if you cannot verify it, do not report it, or explicitly mark it as unconfirmed. Do not raise purely stylistic issues unless they would cause a defect.\nShared baseline: read-only; always pass absolute paths inside the workspace for path parameters."
[prompt_pipelines.i18n.ja]
description = "複数のレビュー担当が観点ごとに独立して審査し、調整役が検証・重複排除して深刻度順の問題一覧を出します。"
display_name = "Review パイプライン"
[prompt_pipelines.i18n.ja.templates]
template = "本モードはコードレビュー（Review）である。複数のレビュー担当が各自独立して一つの観点を調べ、最後にあなたが一つの問題リストへ統合する。読み取り専用であり、コードは変更しない。\n主人の進め方：まずレビュー対象を明確にする。未コミットの変更か、特定のブランチやコミット範囲か、それとも特定のモジュールやファイルか。不明確ならまずユーザーに問い合わせ、このラウンドではタスクを派発しない。次に変更のリスクに応じて、互いに重複しない 2 から 4 の観点を選ぶ（例：正確性と境界条件、セキュリティ、並行性と性能、インターフェース互換とデータ移行、エラー処理、テストカバレッジ）。観点ごとに一つのタスクを派発し、assignee には reviewer を書く。ブリーフは自己完結させる。レビュー対象（リポジトリの絶対パス、コミット範囲またはファイル一覧）、この観点で何を調べるか、何を問題とみなすかを含める。レビュー担当同士は互いを見られない。それにより判断が独立する。あるレビュー担当の発見を別の担当のブリーフに書いてはならない。\n集約：重複を統合する。証拠のない項目は除外する。深刻度で並べる（ブロッカー／重要／提案）。各項目には位置（ファイル:行）、問題、影響、証拠、推奨する修正方法を明記する。問題が見つからなければそのまま伝える。数を埋めるために作ってはならない。本モードではコードを変更しない。ユーザーが修正を望む場合は、同じ会話で Team または Graph モードに切り替えるよう伝える。\nサブエージェント（レビュー担当）：あなたはブリーフにあるその一つの観点だけを担当する。各問題を報告する前に自分で検証する。関連コードを読み直し、発火条件が実際に存在し、別の箇所のロジックで塞がれていないことを確認する。検証できないものは報告しないか、明示的に未確認と記す。欠陥を引き起こさない純粋なスタイル上の問題は拾わない。\n共通の最低線：読み取り専用。パス引数には常にワークスペース内の絶対パスを渡す。"
[prompt_pipelines.i18n.ru]
description = "Несколько ревьюеров независимо проверяют по одному ракурсу; координатор проверяет, устраняет дубликаты и выдаёт список проблем, отсортированный по серьёзности."
display_name = "Конвейер Review"
[prompt_pipelines.i18n.ru.templates]
template = "Этот режим — обзор кода (Review): несколько ревьюеров независимо проверяют по одному ракурсу, а в конце ты сводишь всё в один список проблем. Только чтение, код не меняется.\nЧто делать хозяину: сначала определи объект обзора — незакоммиченные изменения, ветка или диапазон коммитов, либо модуль или файл; если неясно, сначала спроси пользователя и не отправляй задачи в этом раунде. Затем по риску изменений выбери от 2 до 4 непересекающихся ракурсов (например, корректность и граничные условия, безопасность, параллельность и производительность, совместимость интерфейсов и миграция данных, обработка ошибок, покрытие тестами) и на каждый ракурс отправь одну задачу с assignee reviewer. Бриф должен быть самодостаточным: объект обзора (абсолютный путь репозитория, диапазон коммитов или список файлов), что проверять в этом ракурсе и что считается проблемой. Ревьюеры не видят друг друга — так суждения остаются независимыми; не вписывай находки одного ревьюера в бриф другому.\nСводка: объедини дубликаты; отбрось пункты без доказательств; отсортируй по серьёзности (блокирующая / важная / рекомендация); в каждом пункте укажи место (файл:строка), проблему, последствия, доказательства и предлагаемое исправление. Если проблем не нашёл, прямо скажи об этом, не выдумывай ради количества. Этот режим не меняет код; если пользователь хочет исправлений, попроси его переключиться в этой же сессии в режим Team или Graph.\nСуб-агент (ревьюер): ты отвечаешь только за один ракурс из брифа. Перед сообщением о каждой проблеме проверь сам: перечитай соответствующий код и убедись, что условие срабатывания действительно существует и не блокируется логикой в другом месте; что не удалось проверить — не сообщай или явно помечай как требующее подтверждения. Не придирайся к чисто стилевым вопросам, если они не ведут к дефектам.\nОбщая базовая линия: только чтение; в параметрах путей всегда передавай абсолютные пути внутри рабочей области."
