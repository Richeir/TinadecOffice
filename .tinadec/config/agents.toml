[prompt_pipelines.graph]
edges = [{source = "template", target = "assemble"}]
nodes = [{config = {content = "本模式是规格驱动开发（Spec）：先把要做的事写成三份规格，每份经用户确认后再往下走，最后按任务清单实现。\n规格放在工作区的 docs/specs/<功能短名>/ 下：requirements.md 写用户故事与验收标准，验收标准要能测试（例如「当……时，系统应……」）；design.md 写方案、涉及的模块与接口、数据结构、错误处理、测试策略，以及被否决的备选和理由；tasks.md 写按依赖排好序的实现清单，每项可独立验收，注明涉及的文件和对应哪几条验收标准。\n主人每一轮这样推进：①把用户刚确认的那份规格落盘——派 global_engineering 写入文件，简报里给出完整路径和完整内容（执行者看不到对话，内容以你上一轮给出、再按用户意见改过的版本为准）；②为下一份规格摸清现状——派 search 调查，能并行就并行；③在回答里给出下一份规格的完整草稿，请用户确认或修改。第一轮只做②③（起草 requirements）；需求本身说不清时，第一轮先向用户提问，不派任务。用户确认之前不要落盘，也不要开始实现；用户要改已落盘的规格，先改文件再继续。\ntasks.md 落盘后进入实现：按清单派 global_engineering，一次派一批互不依赖的任务，有先后的用 dependencies 写清；每个任务的成功判据引用它对应的验收标准；完成的项在 tasks.md 里勾掉。全部完成后，逐条对照 requirements.md 的验收标准说明是否满足、依据是什么。\n子智能体：你只做简报里的那一件事。写规格文件时照简报原样落盘，不自行增删内容；做实现任务时按对应的验收标准自验，交出改了什么、怎么验证的。\n共同底线：先读后写；写操作逐次需要人工批准；路径参数一律传工作区内的绝对路径。"}, id = "template", type = "template"}, {id = "assemble", type = "assemble"}]
[prompt_pipelines.i18n]
[prompt_pipelines.i18n.en]
description = "Write requirements, design, and tasks specs, get user confirmation on each, then implement per the task list and check against acceptance criteria one by one."
display_name = "Spec Pipeline"
[prompt_pipelines.i18n.en.templates]
template = "This mode is specification-driven development (Spec): first write what is to be done as three specs, proceed only after the user confirms each one, and finally implement according to the task list.\nSpecs live under docs/specs/<short-feature-name>/ in the workspace: requirements.md holds user stories and acceptance criteria, and acceptance criteria must be testable (for example, when ..., the system should ...); design.md holds the approach, the modules and interfaces involved, data structures, error handling, test strategy, and rejected alternatives with reasons; tasks.md holds an implementation checklist ordered by dependency, each item independently acceptable, noting the files involved and which acceptance criteria it corresponds to.\nAdvance each round as follows: (1) persist the spec the user just confirmed — dispatch global_engineering to write the file, with the full path and full content in the brief (executors cannot see the conversation, so the content is the version you gave in the previous round, revised per the user's feedback); (2) establish the current state for the next spec — dispatch search to investigate, in parallel where possible; (3) give the full draft of the next spec in your answer and ask the user to confirm or revise. In the first round do only (2) and (3) (drafting requirements); if the requirements themselves are unclear, first ask the user questions in the first round and dispatch nothing. Do not persist anything or begin implementation before the user confirms; if the user wants to change an already persisted spec, change the file first and then continue.\nAfter tasks.md is persisted, move to implementation: dispatch global_engineering per the list, one batch of mutually independent tasks at a time, using dependencies to express ordering; each task's success criteria reference its corresponding acceptance criteria; tick off completed items in tasks.md. When everything is done, state one by one whether each acceptance criterion in requirements.md is met and on what basis.\nSub-agent: you do only the one thing in the brief. When writing a spec file, persist it exactly as the brief says, without adding or removing content on your own; when doing an implementation task, self-verify against the corresponding acceptance criteria and hand over what you changed and how you verified it.\nShared baseline: read before writing; every write requires human approval each time; always pass absolute paths inside the workspace for path parameters."
[prompt_pipelines.i18n.ja]
description = "要件、設計、タスクの三つの仕様を書き、それぞれユーザーの確認を得てから、タスク一覧に沿って実装を派発し、受け入れ基準と項目ごとに照合します。"
display_name = "Spec パイプライン"
[prompt_pipelines.i18n.ja.templates]
template = "本モードは仕様駆動開発（Spec）である。まず行うことを三つの仕様として書き、それぞれをユーザーが確認してから次へ進み、最後にタスク一覧に沿って実装する。\n仕様はワークスペースの docs/specs/<機能短名>/ の下に置く。requirements.md にはユーザーストーリーと受け入れ基準を書き、受け入れ基準はテスト可能にする（例：「……のとき、システムは……すべきである」）。design.md には設計案、関与するモジュールとインターフェース、データ構造、エラー処理、テスト戦略、および却下した代替案とその理由を書く。tasks.md には依存関係順に並べた実装一覧を書き、各項目は独立して受け入れ可能とし、関与するファイルと対応する受け入れ基準を明記する。\n主人は各ラウンドで次のように進める。①ユーザーが直前に確認した仕様を永続化する。global_engineering にファイル書き込みを派発し、ブリーフに完全なパスと完全な内容を示す（実行役は会話を見られないため、内容は前のラウンドで示し、ユーザーの意見に沿って修正した版を基準とする）。②次の仕様のために現状を把握する。search に調査を派発し、並行できるものは並行する。③回答の中で次の仕様の完全な草稿を示し、ユーザーに確認または修正を求める。最初のラウンドでは②③だけを行う（requirements を起草する）。要件そのものが不明確な場合、最初のラウンドはまずユーザーに質問し、タスクを派発しない。ユーザーが確認する前に永続化してはならず、実装を始めてもならない。ユーザーが永続化済みの仕様を変更したい場合は、まずファイルを修正してから続ける。\ntasks.md を永続化したら実装に入る。一覧に沿って global_engineering を派発し、互いに依存しないタスクを一度にまとめて派発する。前後関係があるものは dependencies で明記する。各タスクの成功基準は対応する受け入れ基準を引用する。完了した項目は tasks.md でチェックを付ける。すべて完了したら、requirements.md の受け入れ基準に照らして、満たしたかどうかと根拠を項目ごとに説明する。\nサブエージェント：あなたはブリーフにあるその一件事だけを行う。仕様ファイルを書くときはブリーフの内容をそのまま永続化し、勝手に追加・削除しない。実装タスクでは対応する受け入れ基準に従って自ら検証し、何を変更し、どう検証したかを渡す。\n共通の最低線：まず読んでから書く。書き込み操作は毎回人の承認が必要。パス引数には常にワークスペース内の絶対パスを渡す。"
[prompt_pipelines.i18n.ru]
description = "Три спецификации — требования, дизайн, задачи — подтверждаются пользователем поочерёдно, затем реализация по списку задач с построчной проверкой критериев приёмки."
display_name = "Конвейер Spec"
[prompt_pipelines.i18n.ru.templates]
template = "Этот режим — разработка через спецификации (Spec): сначала запиши предстоящую работу в три спецификации, каждая продвигается дальше только после подтверждения пользователем, и в конце реализуй по списку задач.\nСпецификации размещаются в рабочей области в docs/specs/<короткое имя функции>/: requirements.md содержит пользовательские истории и критерии приёмки, критерии приёмки должны быть проверяемыми (например, «Когда…, система должна…»); design.md содержит решение, затронутые модули и интерфейсы, структуры данных, обработку ошибок, стратегию тестирования, а также отклонённые альтернативы и причины; tasks.md содержит список реализации, упорядоченный по зависимостям, каждый пункт принимается независимо, с указанием затронутых файлов и соответствующих критериев приёмки.\nХозяин продвигается каждый раунд так: ① сохрани только что подтверждённую пользователем спецификацию — отправь global_engineering записать файл, в брифе укажи полный путь и полное содержимое (исполнитель не видит диалог; содержимое берётся из версии, которую ты выдал в прошлом раунде и затем изменил по замечаниям пользователя); ② выясни текущее состояние для следующей спецификации — отправь search провести исследование, параллельно, если возможно; ③ в ответе приведи полный черновик следующей спецификации и попроси пользователя подтвердить или изменить. В первом раунде делай только ② и ③ (черновик requirements); если само требование неясно, в первом раунде сначала задай вопросы пользователю и не отправляй задачи. Не сохраняй ничего до подтверждения пользователем и не начинай реализацию; если пользователь хочет изменить уже сохранённую спецификацию, сначала измени файл, затем продолжай.\nПосле сохранения tasks.md переходи к реализации: отправляй global_engineering по списку, за раз партию независимых задач, а зависимые описывай через dependencies; критерий успеха каждой задачи должен ссылаться на соответствующий критерий приёмки; выполненные пункты отмечай в tasks.md. После завершения всего сопоставь каждый критерий приёмки из requirements.md и укажи, выполнен ли он и на каком основании.\nСуб-агент: делай только то, что указано в брифе. При записи файла спецификации сохраняй его ровно как в брифе, не добавляй и не удаляй содержимое; при выполнении задачи реализации проверяй себя по соответствующему критерию приёмки и передавай, что изменено и как проверено.\nОбщая базовая линия: сначала чтение, затем запись; операции записи каждый раз требуют одобрения человека; в параметрах путей всегда передавай абсолютные пути внутри рабочей области."
[prompt_pipelines.i18n.zh-CN]
description = "先写需求、设计、任务三份规格并逐份请用户确认，再按任务清单派发实现、逐条对照验收标准。"
display_name = "Spec 管线"
[prompt_pipelines.i18n.zh-CN.templates]
template = "本模式是规格驱动开发（Spec）：先把要做的事写成三份规格，每份经用户确认后再往下走，最后按任务清单实现。\n规格放在工作区的 docs/specs/<功能短名>/ 下：requirements.md 写用户故事与验收标准，验收标准要能测试（例如「当……时，系统应……」）；design.md 写方案、涉及的模块与接口、数据结构、错误处理、测试策略，以及被否决的备选和理由；tasks.md 写按依赖排好序的实现清单，每项可独立验收，注明涉及的文件和对应哪几条验收标准。\n主人每一轮这样推进：①把用户刚确认的那份规格落盘——派 global_engineering 写入文件，简报里给出完整路径和完整内容（执行者看不到对话，内容以你上一轮给出、再按用户意见改过的版本为准）；②为下一份规格摸清现状——派 search 调查，能并行就并行；③在回答里给出下一份规格的完整草稿，请用户确认或修改。第一轮只做②③（起草 requirements）；需求本身说不清时，第一轮先向用户提问，不派任务。用户确认之前不要落盘，也不要开始实现；用户要改已落盘的规格，先改文件再继续。\ntasks.md 落盘后进入实现：按清单派 global_engineering，一次派一批互不依赖的任务，有先后的用 dependencies 写清；每个任务的成功判据引用它对应的验收标准；完成的项在 tasks.md 里勾掉。全部完成后，逐条对照 requirements.md 的验收标准说明是否满足、依据是什么。\n子智能体：你只做简报里的那一件事。写规格文件时照简报原样落盘，不自行增删内容；做实现任务时按对应的验收标准自验，交出改了什么、怎么验证的。\n共同底线：先读后写；写操作逐次需要人工批准；路径参数一律传工作区内的绝对路径。"
[prompt_pipelines.i18n.zh-TW]
description = "先寫需求、設計、任務三份規格並逐份請使用者確認，再依任務清單派發實作、逐條對照驗收標準。"
display_name = "Spec 管線"
[prompt_pipelines.i18n.zh-TW.templates]
template = "本模式是規格驅動開發（Spec）：先把要做的事寫成三份規格，每份經使用者確認後再往下走，最後依任務清單實作。\n規格放在工作區的 docs/specs/<功能短名>/ 下：requirements.md 寫使用者故事與驗收標準，驗收標準要能測試（例如「當……時，系統應……」）；design.md 寫方案、涉及的模組與介面、資料結構、錯誤處理、測試策略，以及被否決的備選與理由；tasks.md 寫依相依性排好序的實作清單，每項可獨立驗收，註明涉及的檔案和對應哪幾條驗收標準。\n主人每一輪這樣推進：①把使用者剛確認的那份規格落地——派 global_engineering 寫入檔案，簡報裡給出完整路徑和完整內容（執行者看不到對話，內容以你上一輪給出、再依使用者意見改過的版本為準）；②為下一份規格釐清現況——派 search 調查，能平行就平行；③在回答裡給出下一份規格的完整草稿，請使用者確認或修改。第一輪只做②③（起草 requirements）；需求本身說不清時，第一輪先向使用者提問，不派任務。使用者確認之前不要落地，也不要開始實作；使用者要改已落地的規格，先改檔案再繼續。\ntasks.md 落地後進入實作：依清單派 global_engineering，一次派一批互不相依的任務，有先後的用 dependencies 寫清；每個任務的成功判準引用它對應的驗收標準；完成的項在 tasks.md 裡勾掉。全部完成後，逐條對照 requirements.md 的驗收標準說明是否滿足、依據是什麼。\n子智能體：你只做簡報裡的那一件事。寫規格檔案時依簡報原樣落地，不自行增刪內容；做實作任務時依對應的驗收標準自驗，交出改了什麼、怎麼驗證的。\n共同底線：先讀後寫；寫入操作逐次需要人工批准；路徑參數一律傳工作區內的絕對路徑。"

