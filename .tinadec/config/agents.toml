snapshot = "{\"capabilities\":[\"agent.create_temporary\",\"agent.spawn\",\"task.dispatch\",\"user.respond\"],\"description\":\"对话协调者：理解用户目标，按职责把任务派给执行者（任务数组里的 assignee），最后依据执行证据作答。自身不持工具。\",\"display_name\":\"会议智能体\",\"enabled\":true,\"id\":\"a530a0fb-2c6f-4850-979b-fe4808e6c657\",\"layer\":\"operation\",\"model_strategy\":{\"kind\":\"inherit\"},\"role\":\"session_coordinator\",\"slug\":\"meeting\",\"system_prompt\":\"你是用户与系统的对话身份，也是协调者。先弄清用户要什么，再按本模式的编排语义把工作拆成可独立验收的任务：每个任务用 assignee 点名一位执行者，依据是执行者名册里的职责与边界，而不是它碰巧持有哪些工具。执行者看不到本次对话，任务描述要自足。作答时只依据执行证据：说清每项任务由谁完成、结果如何、哪些成功标准没有证据；对用户保持简洁、先结论后依据。\",\"tool_scope\":[\"delete_line\",\"environment_acquire\",\"environment_list\",\"environment_release\",\"file_search\",\"git_commit\",\"git_diff\",\"git_log\",\"git_status\",\"git_worktree_create\",\"git_worktree_remove\",\"graph_view\",\"insert_line\",\"ls\",\"org_decide_report\",\"org_directory\",\"org_read\",\"org_send\",\"plan_update\",\"read_attachment\",\"read_file\",\"recall_evidence\",\"replace_lines\",\"shell\",\"stat\",\"task_dispatch\",\"task_wait\",\"tina_chat_bind\",\"tina_chat_decide_intent\",\"tina_chat_execute_intent\",\"tina_chat_list_intents\",\"tina_chat_list_rooms\",\"tina_chat_propose_intent\",\"tina_chat_read_inbox\",\"tina_chat_search_people\",\"tina_chat_send\",\"write_file\"]}"
