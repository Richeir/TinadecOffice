# Runtime-only policy baseline. Formal Agent and Mode definitions are bootstrapped
# once from Runtime/Configuration/bootstrap-agent-directory.toml and then live in
# the AgentConfiguration database. This file is never an Agent roster.

schema_version = 1

[spawn]
max_depth = 2
max_agents_per_run = 16
max_parallel_workers = 4

[scheduling]
max_active_runs_per_session = 2
worker_retry_limit = 2
preserve_partial_results = true

[supervision]
required_before_final = true
max_revision_rounds = 2

# Lateral execution lanes (swim lanes) inside one run. The master switch stays
# off until the multi-lane main loop lands; the ceilings below still freeze
# into every run configuration so admission can rely on them either way.
[orchestration]
lanes_enabled = false
max_lanes_per_run = 4
max_tasks_per_lane = 6

# Context policy. default_token_budget is the finite context-window allocation
# used to pack and compress prompts; it is not a cumulative spend cap.
# task_token_budget and run_token_budget are cumulative token fuses. Both ship
# disabled: repeated calls, consecutive errors, empty turns and hard tool-call
# ceilings still stop abnormal workers without cutting normal long investigations.
[context]
default_token_budget = 131072
task_token_budget = 0
run_token_budget = 0
recent_message_limit = 128
optimistic_revision = true

[memory]
candidate_only = true
retrieval_limit = 8
allowed_scopes = ["principal", "workspace", "project", "agent"]
allowed_kinds = ["fact", "preference", "decision", "success_pattern", "failure_pattern", "task_template", "supervision_rule"]

[tools]
provider = "tinadec-tools-process"
mutation_requires_approval = true
serialize_workspace_writes = true
default_timeout_seconds = 600

# Rounds are a safety fuse, not the primary convergence mechanism: 0 means
# unlimited. What actually stops a worker is the loop guard (repeated calls,
# consecutive errors, consecutive empty responses) plus the token budgets; the
# round limit survives only as an optional narrowing device for callers that
# want a tighter bound. Values above 0 are clamped to the Core ceiling (32).
max_tool_rounds = 0

# Absolute per-task tool-call FUSE, not a budget. A normal task never reaches
# it; it exists because Core also runs unattended (auto-approve / full-access)
# where nobody is at the keyboard to interrupt a runaway loop. Tripping it is
# reported with hard_ceiling = true so it is never mistaken for a spent budget.
# 0 disables the fuse explicitly.
max_tool_calls = 500

# Per-task round overrides, keyed by the planner's task category (the risk class
# doubles as the key when the planner omits category). Every value is clamped to
# the per-task ceiling (32) at parse time; 0 means unlimited for that category,
# so these entries are how a caller narrows specific classes without restoring a
# global round gate.
[tools.task_round_overrides]
test = 0
build = 0
refactor = 0
investigate = 0

# Tool approval policy. This section is the user-facing source of truth for
# which calls may run without a click. Every key is optional: an omitted key
# keeps the built-in baseline, and a file without this section keeps the
# compiled defaults (used by embedded hosts).
[approval]
# Master switch for the "auto-approve" permission mode. A frozen "full-access"
# run ignores it and releases every call; "default"/"ask" still parks writes.
enabled = true

# Highest risk rank the auto-approve policy may release on its own:
# low < medium < elevated < high < critical. "elevated" is never auto-approved
# at any ceiling. Unknown values fail the runtime.toml load instead of guessing.
risk_max = "low"

# Per-run ceiling on policy-minted approvals. When it is spent the call parks
# for a person (never denied). Read-only tools also spend this budget, so raise
# it if a normal exploratory run does many fetches.
max_per_run = 32

# In "default"/"ask", release read-only claims and read-only approval-gated
# tools without a click. A read cannot change the workspace; the tool process
# still enforces its own root and address guards. Mutating calls and
# human_only_tools are untouched.
release_read_only_in_ask_mode = true

# Tools that always wait for a person, whatever the risk and mode (a frozen
# full-access run is the only exception). Tool ids ending in "_delete" or
# starting with "delete_" are refused as well. web_fetch is deliberately absent:
# it cannot change the workspace and its guard rejects private/loopback targets.
# Add "web_fetch" here to force a click on every fetch.
human_only_tools = ["git_push", "command_run", "shell", "git_worktree_remove", "mcp_invoke"]

# Tools a delegated approval gate (delegate-*) may never decide on its own.
# Egress stays with the person in delegated modes.
delegation_blocked_tools = ["web_fetch", "mcp_invoke"]

# Highest risk a delegated approval gate may decide. Above it the call waits
# for the person. Keep at or below "medium" unless the delegate is trusted.
delegated_risk_max = "medium"

# Operational-role trigger chain (context compression, skill recommendation,
# experience curation, git stewardship). Roles stay dormant when disabled or
# when the frozen roster does not carry the role. context_token_threshold must
# stay below default_token_budget -- the pair is validated at load time,
# because a threshold at or above the budget makes compression either never
# fire or always fire.
[triggers]
enabled = true
context_token_threshold = 48000
compress_on_task_closed = true
recommend_on_task_created = true
curate_on_run_closed = true
git_steward_on_run_closed = true
